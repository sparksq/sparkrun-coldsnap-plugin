[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkrun-coldsnap-plugin"
version = "0.1.0"
description = "First-party ColdSnap integration for SparkRun"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE_EXCEPTION"]
requires-python = ">=3.12"
dependencies = ["sparkrun>=0.3.7,<0.4"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparkrun.plugins.coldsnap*"]
namespaces = true

[tool.setuptools.package-data]
"sparkrun.plugins.coldsnap" = ["LICENSE", "LICENSE_EXCEPTION", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
