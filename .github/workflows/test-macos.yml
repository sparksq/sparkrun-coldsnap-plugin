name: macOS controller integration
on:
  push:
    branches: ['main', 'feature/**', 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release:
        description: 'Download and execute the pinned published macOS OCI tools'
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Create native Python environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e . --group dev 'sparkrun==0.3.7'
      # Core has its own native macOS suite. Keep this workflow independent of
      # cross-repository credentials while either source repository is private.
      - name: Test native provider IPC, acquisition and cancellation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TMPDIR: /tmp
          COLDSNAP_TEST_RELEASE_DOWNLOAD: ${{ (inputs.verify_release || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')) && '1' || '' }}
        run: .venv/bin/python -m pytest -v -p no:cacheprovider tests
