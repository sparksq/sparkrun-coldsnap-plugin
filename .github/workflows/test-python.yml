# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Test (Python)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  # github.ref is stable across pushes to the same PR (refs/pull/N/merge), so
  # this still cancels a superseded run when you push again — the case where
  # cancelling is the right outcome. It deliberately does NOT collapse the
  # push and pull_request runs of one commit: that duplicate is avoided with
  # ci.push_branches instead, because a cancelled run reports as cancelled
  # rather than as success.
  group: test-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-sparkrun-coldsnap-plugin:
    name: Test sparkrun-coldsnap-plugin (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Lint with ruff
        run: |
          pip install ruff==0.15.9
          ruff check .
        working-directory: .

      - name: Install
        run: uv pip install --system -e . --group dev 'sparkrun==0.3.7'
        working-directory: .

      - name: Run tests
        run: python -m pytest -v
        working-directory: .

      - name: Verify versions are in sync
        run: |
          python scripts/update-versions.py --check
        working-directory: .

      - name: Verify generated workflows
        run: |
          python scripts/generate-ci-gha.py --check
        working-directory: .
